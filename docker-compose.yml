version: '3.7'

volumes:
    logs:
        driver: local

services:
    slim:
        build: 
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www
        environment:
            docker: "true"
        ports:
            - "8080:8080"
        volumes:
            - .:/var/www
            - logs:/var/www/logs
        command: |
            sh -c "
                composer install --no-interaction --no-plugins --no-scripts
                php -S 0.0.0.0:8080 -t public
            "